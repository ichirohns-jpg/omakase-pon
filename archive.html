<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e83e8c">
<title>記事アルバム｜ふじこの志木案内〜ぽん</title>
<meta name="description" content="ふじこの志木案内〜ぽんの記事アルバムです。">
<link rel="icon" href="fujiko.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="fujiko.jpg">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --pink:#e83e8c;
  --pinkDark:#bd246d;
  --pinkSoft:#fff0f7;
  --pinkLine:#f5bdd8;
  --green:#28796c;
  --ink:#3b3942;
  --muted:#70717a;
  --shadow:0 8px 24px rgba(190,36,109,.12)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  padding-bottom:92px;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 0,#ffe2ef 0,transparent 28%),
    linear-gradient(180deg,#fff7fb 0,#fff 45%,#f0fbfc 100%);
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  font-size:18px;
  line-height:1.7;
  -webkit-text-size-adjust:100%
}
a{color:inherit}
.page{
  width:min(100%,760px);
  min-height:100vh;
  margin:auto;
  background:#ffffffdc
}
.header{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  color:#fff;
  background:linear-gradient(135deg,#e83e8c,#c32670);
  border-bottom:4px solid #ffc5df;
  box-shadow:0 4px 16px #bd246d30
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
  font-weight:900
}
.brand img{
  width:54px;
  height:54px;
  object-fit:cover;
  border:3px solid #fff;
  border-radius:50%
}
.brandTitle{
  font-size:18px;
  line-height:1.15
}
.brandSub{
  display:block;
  margin-top:3px;
  color:#ffe6f1;
  font-size:12px
}
.back{
  padding:10px 12px;
  border-radius:999px;
  color:var(--pinkDark);
  background:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:900;
  white-space:nowrap
}
main{padding:16px 14px 28px}
.hero{
  padding:24px 18px;
  border-radius:26px;
  color:#fff;
  background:linear-gradient(135deg,#e83e8c,#f38bb8 55%,#80d4c7);
  box-shadow:var(--shadow)
}
.hero h1{
  margin:0;
  font-size:clamp(29px,8vw,43px);
  line-height:1.25
}
.hero p{
  margin:7px 0 0;
  font-weight:800
}
.section{
  margin-top:17px;
  padding:20px 16px;
  border:2px solid var(--pinkLine);
  border-radius:26px;
  background:#fff;
  box-shadow:var(--shadow)
}
.sectionHeading{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  color:var(--pinkDark);
  font-size:27px;
  line-height:1.3
}
.sectionHeading::before{
  content:"";
  width:9px;
  height:32px;
  border-radius:99px;
  background:var(--pink)
}
.lead{
  margin:6px 0 0;
  color:var(--muted);
  font-size:17px;
  font-weight:700
}
.destinationGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:16px
}
.destinationCard{
  min-height:112px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  padding:12px 7px;
  border:2px solid var(--pinkLine);
  border-radius:20px;
  color:var(--pinkDark);
  background:linear-gradient(145deg,#fff8fc,#ffeaf4);
  text-align:center;
  text-decoration:none;
  box-shadow:0 5px 14px #bd246d18
}
.destinationCard:active{
  transform:scale(.97)
}
.destinationCard:nth-child(2){
  color:#6c5a17;
  background:linear-gradient(145deg,#fffdf0,#fff2bf);
  border-color:#f2d36e
}
.destinationCard:nth-child(3){
  color:#246f67;
  background:linear-gradient(145deg,#f1fffd,#dff7f3);
  border-color:#b9e6e1
}
.destinationCard:nth-child(4){
  color:#a33b73;
  background:linear-gradient(145deg,#fff4fa,#f7d9e9);
  border-color:#efb7d4
}
.destinationCard:nth-child(5){
  color:#5c4c96;
  background:linear-gradient(145deg,#faf7ff,#e9e0ff);
  border-color:#d4c5f4
}
.destinationCard:nth-child(6){
  color:#39702c;
  background:linear-gradient(145deg,#f5fff0,#dff4d6);
  border-color:#bfe4b5
}
.destinationIcon{
  font-size:29px;
  line-height:1.1
}
.destinationName{
  font-size:17px;
  line-height:1.25;
  font-weight:900
}
.destinationText{
  font-size:11px;
  line-height:1.25;
  font-weight:800;
  opacity:.82
}
.monthGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:15px
}
.monthGrid a{
  padding:13px 8px;
  border:2px solid var(--pinkLine);
  border-radius:18px;
  background:var(--pinkSoft);
  color:var(--pinkDark);
  text-align:center;
  text-decoration:none;
  font-weight:900
}
.monthGrid a.active{
  color:#fff;
  background:var(--pink);
  border-color:var(--pink)
}
.monthGrid small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:12px
}
.monthGrid a.active small{
  color:#ffe3f0
}
.status{
  margin-top:13px;
  padding:11px 13px;
  border-radius:15px;
  background:#fff7db;
  color:#766018;
  font-weight:800
}
.status.error{
  background:#fff0f3;
  color:#b32056
}
.articles{
  display:grid;
  gap:13px;
  margin-top:15px
}
.article{
  padding:16px;
  border:2px solid #f4cade;
  border-radius:20px;
  background:linear-gradient(180deg,#fff7fb,#fff);
  box-shadow:0 5px 14px #bd246d10
}
.date{
  color:var(--pink);
  font-size:14px;
  font-weight:900
}
.article h3{
  margin:4px 0 0;
  color:var(--green);
  font-size:24px;
  line-height:1.35
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px
}
.tag{
  padding:4px 9px;
  border-radius:999px;
  background:#e8f8e1;
  color:#39702c;
  font-size:12px;
  font-weight:900
}
.excerpt{
  margin:10px 0 0;
  color:var(--muted);
  font-size:17px;
  font-weight:700;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden
}
.open{
  display:block;
  margin-top:13px;
  padding:11px;
  border-radius:999px;
  color:#fff;
  background:var(--pink);
  text-align:center;
  text-decoration:none;
  font-weight:900
}
.empty{
  padding:20px;
  border-radius:16px;
  background:#fff7fb;
  color:var(--muted);
  text-align:center;
  font-weight:800
}
.footer{
  padding:24px 14px 35px;
  color:#8a6377;
  text-align:center;
  font-size:14px;
  font-weight:800
}
.bottom{
  position:fixed;
  z-index:40;
  left:0;
  right:0;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  background:#fffdfef5;
  border-top:2px solid #f3bfd8;
  box-shadow:0 -5px 18px #bd246d18
}
.bottom a{
  padding:5px 2px;
  color:var(--pinkDark);
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:900
}
.bottom span{
  display:block;
  font-size:22px;
  line-height:1.05
}
@media(min-width:620px){
  .monthGrid{
    grid-template-columns:repeat(4,1fr)
  }
}
</style>
</head>

<body>
<div class="page">

<header class="header">
<a class="brand" href="./">
<img src="fujiko.jpg" alt="ふじこ">
<span class="brandTitle">
ふじこの<br>
志木案内〜ぽん
<span class="brandSub">志木のことなら〜ふじこにおまかせ❣️</span>
</span>
</a>
<a class="back" href="./">トップへ戻る</a>
</header>

<main>

<section class="hero">
<h1>ふじこの記事アルバム</h1>
<p>志木の魅力を、案内先と月ごとにゆっくり見られます。</p>
</section>

<section class="section">
<h2 class="sectionHeading">投稿先から探す</h2>
<p class="lead">見たい案内先を選ぶと、その場所の記事がトップページに表示されます。</p>
<div id="destinationButtons" class="destinationGrid"></div>
</section>

<section class="section">
<h2 class="sectionHeading">月から探す</h2>
<p class="lead">読みたい月をタップしてください。</p>
<div id="monthList" class="monthGrid"></div>
</section>

<section class="section" id="articles">
<h2 id="articleHeading" class="sectionHeading">最新の記事</h2>
<div id="status" class="status">記事を読み込んでいます……</div>
<div id="articleList" class="articles"></div>
</section>

</main>

<footer class="footer">
ふじこの志木案内〜ぽん<br>
志木のことなら〜ふじこにおまかせ❣️
</footer>
</div>

<nav class="bottom">
<a href="./"><span>🏠</span>トップ</a>
<a href="./#articles"><span>📖</span>記事</a>
<a href="archive.html"><span>🗓️</span>月別</a>
<a href="./#messages"><span>💌</span>応援</a>
</nav>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbzoZ6BPqcHTmigI6zdUB96sAPTtZ4PhMF9-pLWr8y3nRtkbGFrPbUopm2gNx3d4YBfTYw/exec";
const requestedMonth=new URLSearchParams(location.search).get("month")||"";

const DESTINATIONS=[
  {name:"お店紹介",icon:"🍜",text:"志木のお店・会社"},
  {name:"かっぱ像紹介",icon:"🐸",text:"志木のかっぱ像"},
  {name:"志木市の歴史",icon:"🏛️",text:"志木の歴史・文化"},
  {name:"イベント紹介",icon:"🎪",text:"地域の催し"},
  {name:"紙芝居",icon:"📚",text:"ふじこの紙芝居"},
  {name:"志木の魅力・移住定住",icon:"🌿",text:"志木の魅力を発見"}
];

function jsonp(params){
  return new Promise(function(resolve,reject){
    const name="archive_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    const script=document.createElement("script");
    const q=new URLSearchParams(params);
    q.set("callback",name);
    script.src=GAS_URL+"?"+q.toString();

    const timer=setTimeout(function(){
      cleanup();
      reject(new Error("通信がタイムアウトしました。"));
    },20000);

    window[name]=function(data){
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.onerror=function(){
      clearTimeout(timer);
      cleanup();
      reject(new Error("GASに接続できませんでした。"));
    };

    function cleanup(){
      delete window[name];
      if(script.parentNode)script.parentNode.removeChild(script);
    }

    document.body.appendChild(script);
  });
}

function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function articleUrl(article){
  const u=new URL("article.html",location.href);
  u.searchParams.set("id",article.articleId||"");
  return u.href;
}

function renderDestinations(){
  document.getElementById("destinationButtons").innerHTML=
    DESTINATIONS.map(function(item){
      const u=new URL("index.html",location.href);
      u.searchParams.set("category",item.name);
      u.hash="articles";

      return '<a class="destinationCard" href="'+
        esc(u.href)+'">'+
        '<span class="destinationIcon">'+item.icon+'</span>'+
        '<span class="destinationName">'+esc(item.name)+'</span>'+
        '<span class="destinationText">'+esc(item.text)+'</span>'+
        '</a>';
    }).join("");
}

function renderMonths(archives,activeMonth){
  const target=document.getElementById("monthList");

  if(!archives.length){
    target.innerHTML='<div class="empty">記事が増えると月別一覧が表示されます。</div>';
    return;
  }

  target.innerHTML=archives.map(function(item){
    const u=new URL("archive.html",location.href);
    u.searchParams.set("month",item.month);

    return '<a class="'+
      (activeMonth===item.month?"active":"")+
      '" href="'+u.href+'">'+
      esc(item.label)+
      '<small>'+esc(item.count)+'件の記事</small></a>';
  }).join("");
}

function articleCard(article){
  const categories=Array.isArray(article.categories)?article.categories:[];
  const text=String(article.content||"");
  const excerpt=text.length>130?text.slice(0,130)+"…":text;

  return '<article class="article">'+
    '<div class="date">'+esc(article.date||"")+'</div>'+
    '<h3>'+esc(article.theme||"無題の記事")+'</h3>'+
    '<div class="tags">'+
    categories.map(function(category){
      return '<span class="tag">'+esc(category)+'</span>';
    }).join("")+
    '<span class="tag">'+esc(article.format||"記事")+'</span>'+
    '</div>'+
    '<div class="excerpt">'+esc(excerpt)+'</div>'+
    '<a class="open" href="'+esc(articleUrl(article))+'">この記事を読む</a>'+
    '</article>';
}

async function load(){
  const status=document.getElementById("status");
  const list=document.getElementById("articleList");
  const heading=document.getElementById("articleHeading");

  try{
    const data=await jsonp({mode:"articles"});

    if(!data.ok){
      throw new Error(data.error||"記事を取得できませんでした。");
    }

    const archives=Array.isArray(data.archives)?data.archives:[];
    const allArticles=Array.isArray(data.articles)?data.articles:[];
    const activeMonth=requestedMonth||(archives[0]&&archives[0].month)||"";

    renderMonths(archives,activeMonth);

    let articles=allArticles;

    if(activeMonth){
      articles=allArticles.filter(function(article){
        return article.month===activeMonth;
      });

      const label=archives.find(function(item){
        return item.month===activeMonth;
      });

      heading.textContent=label?label.label+"の記事":"月別の記事";
    }else{
      heading.textContent="最新の記事";
    }

    list.innerHTML=articles.length
      ?articles.map(articleCard).join("")
      :'<div class="empty">表示する記事はありません。</div>';

    status.hidden=true;
  }catch(error){
    status.textContent=error.message;
    status.classList.add("error");
  }
}

renderDestinations();
load();
</script>
</body>
</html>
