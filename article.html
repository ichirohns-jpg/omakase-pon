<style>

body{
margin:0;
padding-bottom:92px;

radial-gradient(circle at 15% 0,#ffe2ef 0,transparent 28%),
linear-gradient(180deg,#fff7fb 0,#fff 45%,#f0fbfc 100%);

overflow-x:auto;

background:#f2fbfa;

.location{
margin:18px;
padding:13px;
border:1px solid #f0d47d;
border-radius:16px;
background:#fff9df;
color:#705a19;
font-weight:900
}

.location a{
display:block;
margin-top:5px;
color:#8b6810
}

.sourceLinks{
margin:20px 18px 0;
padding:18px;
border:1px solid var(--pinkLine);
border-radius:20px;
background:#fff8fc
}

.sourceLinksTitle{
margin:0;
color:var(--pinkDark);
font-size:20px;
font-weight:900
}

.sourceLinksNote{
margin:3px 0 0;
color:var(--muted);
font-size:13px;
font-weight:700
}

.sourceLinksList{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px
}

.sourceLink{
display:inline-block;
padding:10px 13px;
border-radius:999px;
color:#7c2455;
background:#fce4f1;

font-size:15px;
font-weight:900

}

.support{

padding:18px;
border-radius:20px;

.shareTitle{

}

.shareNote{

color:var(--muted);
font-size:13px;
font-weight:700
}

.share{

flex-wrap:wrap;
gap:8px;

}

.share a,
.share button{

border:0;
border-radius:999px;
text-decoration:none;
font-size:14px;
font-weight:900;

}

.fb{

background:#e1edff
}

.x{
color:#111827;
background:#e5e7eb
}

.line{

background:#ddf9e7
}

.insta{

}

.copy{

background:#eef2f7

.empty{
margin:18px;
padding:22px;

background:#fff7fb;
color:var(--muted);

font-weight:800
}

.footer{
padding:24px 14px 35px;
color:#8a6377;

font-size:14px;
font-weight:800
}

.bottom{
position:fixed;
z-index:40;
left:0;

<body>

<nav class="bottom">

</nav>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbzoZ6BPqcHTmigI6zdUB96sAPTtZ4PhMF9-pLWr8y3nRtkbGFrPbUopm2gNx3d4YBfTYw/exec";

const CHANNEL_URL="https://www.youtube.com/@shikiconcierge";

const TOP_IMAGE="https://ichirohns-jpg.github.io/omakase-pon/fujiko-top.jpg";

const articleId=
new URLSearchParams(location.search).get("id")||"";


function jsonp(params){
return new Promise(function(resolve,reject){

const name=
"article_"+
Date.now()+
"_"+
Math.floor(Math.random()*10000);

const script=
document.createElement("script");

const q=
new URLSearchParams(params);

q.set("callback",name);

script.src=
GAS_URL+
"?"+
q.toString();

const timer=
setTimeout(function(){
cleanup();

reject(
new Error("通信がタイムアウトしました。")
);

},20000);

window[name]=
function(data){
clearTimeout(timer);
cleanup();
resolve(data)
};

script.onerror=
function(){
clearTimeout(timer);
cleanup();

reject(
new Error("GASに接続できませんでした。")
)
};

function cleanup(){
delete window[name];

if(script.parentNode){
script.parentNode.removeChild(script)
}
}

document.body.appendChild(script)
})
}


function esc(v){
return String(v==null?"":v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")
}


function safeUrl(v){
const s=
String(v||"").trim();

return /^https?:\/\//i.test(s)
?s
:""
}


function youtubeEmbed(v){
const s=
String(v||"").trim();

if(!s){
return "";
}

let m=
s.match(
/youtube\.com\/embed\/([^?&/]+)/i
);

if(m){
return "https://www.youtube.com/embed/"+m[1]
}

m=
s.match(
/youtu\.be\/([^?&/]+)/i
);

if(m){
return "https://www.youtube.com/embed/"+m[1]
}

m=
s.match(
/youtube\.com\/(?:shorts\/|watch\?v=)([^?&/]+)/i
);

return m
?
"https://www.youtube.com/embed/"+
m[1]
:
""
}


function snsLabel(url,index){

const s=
String(url||"").toLowerCase();

if(s.indexOf("instagram.com")>=0){
return "📷 Instagram"
}

if(s.indexOf("facebook.com")>=0||s.indexOf("fb.com")>=0){
return "📘 Facebook"
}

if(s.indexOf("x.com")>=0||s.indexOf("twitter.com")>=0){
return "𝕏 X"
}

if(s.indexOf("line.me")>=0||s.indexOf("lin.ee")>=0){
return "💬 LINE"
}

if(s.indexOf("tiktok.com")>=0){
return "🎵 TikTok"
}

return "🔗 SNS "+(index+1)
}


function sourceLinks(article){

const sns=[
article.sns1,
article.sns2,
article.sns3
]
.map(safeUrl)
.filter(Boolean);

const channel=
safeUrl(
article.youtubeChannel||
article.youtubeChannelUrl
);

if(!sns.length&&!channel){
return ""
}

let html=
'<section class="sourceLinks">'+
'<p class="sourceLinksTitle">紹介先のSNS・YouTube</p>'+
'<p class="sourceLinksNote">紹介先の公式ページをご覧いただけます。</p>'+
'<div class="sourceLinksList">';

sns.forEach(function(url,index){

html+=
'<a class="sourceLink" href="'+
esc(url)+
'" target="_blank" rel="noopener">'+
esc(snsLabel(url,index))+"</a>"
});

if(channel){

html+=
'<a class="sourceLink youtubeSource" href="'+
esc(channel)+
'" target="_blank" rel="noopener">'+
"📺 YouTubeチャンネル"+
"</a>"
}

html+=
"</div></section>";

return html
}


function detailUrl(){
const u=
new URL(
"article.html",
location.href
);

u.searchParams.set(
"id",
articleId
);

return u.href
}


function sharePageUrl(article){
const id=
String(
article&&article.articleId||
articleId||
""
).trim();

if(!id){
return detailUrl()
}

const u=
new URL(
"share-"+id+".html",
location.href
);

return u.href
}


function setMeta(selector,value){
const node=
document.querySelector(selector);

if(node){
node.setAttribute(
"content",
value
)
}
}


function setArticleMeta(article){

const title=
(article.theme||"記事")+
"｜ふじこの志木案内〜ぽん";

const description=
String(
article.content||
"志木のことなら〜ふじこにおまかせ❣️"
)
.replace(/\s+/g," ")
.slice(0,120);

const images=
Array.isArray(article.images)
?
article.images.map(safeUrl).filter(Boolean)
:
[];

const image=
safeUrl(article.ogImage)||
images[0]||
TOP_IMAGE;

const url=
detailUrl();

document.title=
title;

setMeta(
'meta[name="description"]',
description
);

setMeta(
'meta[property="og:title"]',
title
);

setMeta(
'meta[property="og:description"]',
description
);

setMeta(
'meta[property="og:url"]',
url
);

setMeta(
'meta[property="og:image"]',
image
);

setMeta(
'meta[name="twitter:title"]',
title
);

setMeta(
'meta[name="twitter:description"]',
description
);

setMeta(
'meta[name="twitter:image"]',
image
)
}


function media(article){

const embed=
youtubeEmbed(
article.youtubeEmbedUrl||
article.youtubeUrl
);

const format=
String(article.format||"")
.toLowerCase();

if(
format.indexOf("youtube")>=0&&
embed
){

const joiner=
embed.indexOf("?")>=0
?
"&"
:
"?";

return '<div class="media">'+
'<iframe src="'+
esc(
embed+
joiner+
"rel=0&modestbranding=1"
)+
'" title="'+
esc(article.theme||"YouTube動画")+
'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>'+
"</div>"
}

const images=
Array.isArray(article.images)
?
article.images
.map(safeUrl)
.filter(Boolean)
.slice(0,5)
:
[];

if(!images.length){
return "";
}

return '<div class="media">'+
'<div class="slider">'+
images.map(function(src,index){

return '<img src="'+
esc(src)+
'" alt="'+
esc(article.theme||"記事")+
" "+
(index+1)+
'枚目" loading="lazy">'

}).join("")+
"</div>"+
'<div class="slideHint">'+
"画像を横にスライドできます（"+
images.length+
"枚）</div>"+
"</div>"
}


function render(article){

window.currentArticle=
article;

if(!article){

document.getElementById(
"articleBox"
).innerHTML=
'<div class="empty">記事が見つかりません。</div>';

return
}

setArticleMeta(article);

const categories=
Array.isArray(article.categories)
?
article.categories
:
[];

const shareUrl=
sharePageUrl(article);

const encodedUrl=
encodeURIComponent(
shareUrl
);

const encodedText=
encodeURIComponent(
(article.theme||"志木の記事")+
"｜ふじこの志木案内〜ぽん"
);

const mapUrl=
article.hasMap
?
safeUrl(article.mapUrl)
:
"";

const map=
mapUrl
?
'<div class="location">📍 '+
esc(article.placeName||"場所案内")+
'<a href="'+
esc(mapUrl)+
'" target="_blank" rel="noopener">'+
"Googleマップで場所を見る"+
"</a></div>"
:
"";

const source=
sourceLinks(article);

document.getElementById(
"articleBox"
).innerHTML=

'<div class="articleHead">'+
'<div class="date">'+
esc(article.date||"")+
"</div>"+
"<h1>"+
esc(article.theme||"無題の記事")+
"</h1>"+
'<div class="tags">'+

categories.map(function(category){

return '<span class="tag">'+
esc(category)+
"</span>"

}).join("")+

'<span class="tag">'+
esc(article.format||"記事")+
"</span>"+
"</div>"+
"</div>"+

'<div class="content">'+
esc(article.content||"")+
"</div>"+

media(article)+
source+
map+

'<div class="support">'+
"ふじこと志木お助け隊の活動を応援してください❣️"+
"</div>"+

'<a class="subscribe" href="'+
CHANNEL_URL+
'" target="_blank" rel="noopener">'+
"📺 YouTubeチャンネルを登録する"+
"</a>"+

'<div class="shareBox">'+
'<p class="shareTitle">この記事をみんなに知らせる</p>'+
'<p class="shareNote">このページのURLを共有します。</p>'+
'<div class="share">'+

'<a class="fb" href="'+
"https://www.facebook.com/sharer/sharer.php?u="+
encodedUrl+
'" target="_blank" rel="noopener">Facebook</a>'+

'<a class="x" href="'+
"https://twitter.com/intent/tweet?url="+
encodedUrl+
"&text="+
encodedText+
'" target="_blank" rel="noopener">X</a>'+

'<a class="line" href="'+
"https://social-plugins.line.me/lineit/share?url="+
encodedUrl+
'" target="_blank" rel="noopener">LINE</a>'+

'<button class="copy" onclick="copyUrl()">リンクコピー</button>'+

'<button class="insta" onclick="instagram()">Instagram</button>'+

"</div>"+
"</div>"
}


async function copyUrl(){

const url=
sharePageUrl(
window.currentArticle
);

try{

await navigator.clipboard.writeText(url);

alert(
"記事URLをコピーしました。"
)

}catch(error){

prompt(
"リンクをコピーしてください",
url
)
}
}


async function instagram(){

await copyUrl();

window.open(
"https://www.instagram.com/",
"_blank",
"noopener"
)
}


async function load(){

if(!articleId){

document.getElementById(
"articleBox"
).innerHTML=
'<div class="empty">記事IDが指定されていません。</div>';

return
}

try{

const data=
await jsonp({
mode:"article",
id:articleId
});

if(
!data||
!data.ok
){

throw new Error(
data&&data.error
?
data.error
:
"記事を取得できませんでした。"
);
}

render(
data.article
)

}catch(error){

document.getElementById(
"articleBox"
).innerHTML=
'<div class="empty">'+
esc(error.message)+
"</div>"
}
}

load();
</script>

</body>
