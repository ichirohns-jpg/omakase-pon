<style>
:root{
--pink:#e83e8c;
--pinkDark:#bd246d;
--pinkSoft:#fff0f7;
--pinkLine:#f5bdd8;
--water:#e9f9fb;
--green:#28796c;
--ink:#3b3942;
--muted:#70717a;
--shadow:0 8px 24px rgba(190,36,109,.12);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
padding-bottom:92px;
color:var(--ink);
background:
radial-gradient(circle at 15% 0,#ffe2ef 0,transparent 28%),
linear-gradient(180deg,#fff7fb 0,#fff 45%,#f0fbfc 100%);
font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
font-size:18px;
line-height:1.7;

}

a,button{
font:inherit;
-webkit-tap-highlight-color:transparent;
}

button{cursor:pointer}

img{
display:block;
max-width:100%;
}

.page{
width:min(100%,760px);
min-height:100vh;
margin:auto;
background:#ffffffd9;
}

.header{
position:sticky;
top:0;
z-index:30;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
color:#fff;
background:linear-gradient(135deg,#e83e8c,#c32670);
border-bottom:4px solid #ffc5df;
box-shadow:0 4px 16px #bd246d30;
}

.brand{

align-items:center;
gap:10px;
color:#fff;
text-decoration:none;
font-weight:900;

.brand img{
width:54px;
height:54px;

border-radius:999px;

text-decoration:none;
font-size:14px;

main{

.hero{

border:4px solid #fff;
border-radius:26px;
background:#ffddec;

.hero img{
width:100%;

padding:8px 13px;

.media{

background:#211c2a;

.media iframe{
display:block;
width:100%;
aspect-ratio:16/9;
border:0;
}

.slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scrollbar-width:none;

.slider::-webkit-scrollbar{

.slider img{
flex:0 0 100%;
width:100%;
aspect-ratio:16/10;

.slideHint{
padding:6px;
background:#f2fbfa;
color:var(--green);
text-align:center;

padding:11px 12px;
border:1px solid #f0d47d;

font-size:16px;
font-weight:900;

.location a{

margin-top:4px;

.readButton{

padding:13px;

.messages{

.message{

.message b{

.message small{

.message p{

.form{

padding:15px;

background:#fff5fa;
border:1px solid var(--pinkLine);

.form label{
display:grid;
gap:5px;
color:var(--pinkDark);
font-weight:900;

.form input,
.form textarea,

width:100%;
padding:12px;
border:1px solid #e5b4cc;
border-radius:12px;

.form textarea{
min-height:110px;
resize:vertical;
}

.submit{
min-height:56px;
border:0;
border-radius:16px;
color:#fff;

.footer{
padding:24px 14px 35px;
color:#8a6377;
text-align:center;
font-size:14px;
font-weight:800;

.bottom{
position:fixed;
z-index:40;
left:0;
right:0;
bottom:0;
display:grid;
grid-template-columns:repeat(4,1fr);
padding:7px 4px calc(7px + env(safe-area-inset-bottom));
background:#fffdfef5;
border-top:2px solid #f3bfd8;
box-shadow:0 -5px 18px #bd246d18;
}

.bottom a{
padding:5px 2px;
color:var(--pinkDark);
text-align:center;

.bottom span{

<script>
const GAS_URL=
"https://script.google.com/macros/s/AKfycbxg6C9SdTssH5fR7TTlB6jy0Jw_nPcvYYYVV2_vnsG0o-S5PXcvFN3nLhT1uYnz_BdkGg/exec";

const SITE_URL=
"https://ichirohns-jpg.github.io/omakase-pon/";

const selectedCategory=
new URLSearchParams(location.search).get("category")||"";

function jsonp(params){
return new Promise(function(resolve,reject){

const name=
"fujiko_"+
Date.now()+
"_"+
Math.floor(Math.random()*10000);

const script=
document.createElement("script");

const q=
new URLSearchParams(params);

q.set("callback",name);

script.src=
GAS_URL+
"?"+
q.toString();

const timer=
setTimeout(function(){
cleanup();
reject(new Error("通信がタイムアウトしました。"));
},20000);

window[name]=
function(data){
clearTimeout(timer);
cleanup();
resolve(data);
};

script.onerror=
function(){
clearTimeout(timer);
cleanup();
reject(new Error("GASに接続できませんでした。"));
};

function cleanup(){
delete window[name];

if(script.parentNode){
script.parentNode.removeChild(script);
}
}

document.body.appendChild(script);
});
}

function esc(v){
return String(v==null?"":v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function safeUrl(v){
const s=
String(v||"").trim();

return /^https?:\/\//i.test(s)
?s
:"";
}

function youtubeEmbed(v){
const s=
String(v||"").trim();

if(!s){
return "";
}

if(/youtube\.com\/embed\//i.test(s)){
return s;
}

let m=
s.match(/youtu\.be\/([^?&/]+)/i);

if(m){
return "https://www.youtube.com/embed/"+m[1];
}

m=
s.match(/youtube\.com\/(?:shorts\/|watch\?v=)([^?&/]+)/i);

return m
?"https://www.youtube.com/embed/"+m[1]
:"";
}

function articleUrl(a){
const u=
new URL(
"article.html",
location.href
);

u.searchParams.set(
"id",
a.articleId||""
);

return u.href;
}

function media(a){

const embed=
youtubeEmbed(
a.youtubeEmbedUrl||
a.youtubeUrl
);

if(
a.format==="YouTube"&&
embed
){

return `
<div class="media">
<iframe
src="${esc(embed)}?rel=0&modestbranding=1"
title="${esc(a.theme)}"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
`;
}

const images=
Array.isArray(a.images)
?a.images.map(safeUrl).filter(Boolean).slice(0,5)
:[];

if(!images.length){
return "";
}

return `
<div class="media">
<div class="slider">
${images.map(function(src,i){
return `
<img
src="${esc(src)}"
alt="${esc(a.theme)} ${i+1}枚目"
loading="lazy">
`;
}).join("")}
</div>

<div class="slideHint">
画像を横にスライドできます（${images.length}枚）
</div>
</div>
`;
}

function card(a){

const cats=
Array.isArray(a.categories)
?a.categories
:[];

const map=
a.hasMap&&
safeUrl(a.mapUrl)
?
`
<div class="location">
📍 ${esc(a.placeName||"場所案内")}
<a
href="${esc(a.mapUrl)}"
target="_blank"
rel="noopener">
Googleマップで場所を見る
</a>
</div>
`
:"";

const text=
String(a.content||"");

const excerpt=
text.length>120
?text.slice(0,120)+"…"
:text;

return `
<article class="article">

<div class="articleTop">
<div class="date">
${esc(a.date||"")}
</div>

<h3>
${esc(a.theme||"無題の記事")}
</h3>

<div class="tags">
${cats.map(function(c){
return `
<span class="tag">
${esc(c)}
</span>
`;
}).join("")}

<span class="tag">
${esc(a.format||"記事")}
</span>
</div>
</div>

<div class="excerpt">
${esc(excerpt)}
</div>

${media(a)}
${map}

<a
class="readButton"
href="${esc(articleUrl(a))}">
この記事を読む
</a>

</article>
`;
}

function filters(){

const list=[
"お店紹介",
"かっぱ像紹介",
"志木市の歴史",
"イベント紹介",
"紙芝居",
"自然・公園",
"志木の魅力・移住定住"
];

let html=
`
<a
class="${selectedCategory?"":"active"}"
href="./#articles">
すべて
</a>
`;

html+=
list.map(function(c){

const u=
new URL(SITE_URL);

u.searchParams.set(
"category",
c
);

return `
<a
class="${selectedCategory===c?"active":""}"
href="${u.href}#articles">
${esc(c)}
</a>
`;

}).join("");

document.getElementById(
"categoryFilters"
).innerHTML=
html;
}

async function loadArticles(){

const status=
document.getElementById(
"articleStatus"
);

const list=
document.getElementById(
"articlesList"
);

try{

const data=
await jsonp({
mode:"articles"
});

if(!data.ok){
throw new Error(
data.error||
"記事を取得できませんでした。"
);
}

let articles=
Array.isArray(data.articles)
?data.articles
:[];

if(selectedCategory){

articles=
articles.filter(function(a){

return Array.isArray(a.categories)&&
a.categories.indexOf(
selectedCategory
)>=0;

});
}

articles=
articles.slice(0,6);

list.innerHTML=
articles.length
?articles.map(card).join("")
:
`
<div class="empty">
現在公開されている記事はありません。
</div>
`;

status.hidden=
true;

}catch(e){

status.textContent=
e.message;

status.classList.add(
"error"
);
}
}

async function loadMessages(){

try{

const d=
await jsonp({
mode:"messages",
limit:"10"
});

const list=
d.ok&&
Array.isArray(d.messages)
?d.messages
:[];

document.getElementById(
"messagesList"
).innerHTML=
list.length
?
list.map(function(m){

return `
<div class="message">
<b>${esc(m.name||"匿名さん")}</b>
<small>${esc(m.receivedAt||"")}</small>
<p>${esc(m.message||"")}</p>
</div>
`;

}).join("")
:
`
<div class="empty">
応援メッセージが届くと、ここに表示されます。
</div>
`;

}catch(e){

document.getElementById(
"messagesList"
).innerHTML=
`
<div class="empty">
応援メッセージを読み込めませんでした。
</div>
`;
}
}

function jsonpSubmit(params){
return jsonp(params);
}

document
.getElementById("messageForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const button=
e.target.querySelector(
"button[type=submit]"
);

const status=
document.getElementById(
"messageStatus"
);

button.disabled=
true;

button.textContent=
"送信しています……";

status.hidden=
false;

status.textContent=
"送信しています……";

status.className=
"status";

try{

const d=
await jsonpSubmit({

mode:"submitMessage",

name:
document.getElementById(
"messageName"
).value,

message:
document.getElementById(
"messageText"
).value,

allow:
document.getElementById(
"messageAllow"
).value

});

if(!d.ok){

throw new Error(
d.error||
"送信できませんでした。"
);
}

status.textContent=
d.message||
"応援メッセージを受け付けました。";

e.target.reset();

loadMessages();

}catch(err){

status.textContent=
err.message;

status.className=
"status error";

}finally{

button.disabled=
